<!DOCTYPE html>

    <style>
        body {

        }
        .info {
            background: #FFF3E0;
            border-left-color: #FF9800;
        }

            border-radius: 5px;

            margin: 10px 0;

<body>
    <div class="container">

            const whatsappMessage = `*✅ PAGO ACREDITADO - CONGRESO CHEQFIRMA 2025*

💳 *Método de Pago:* ${seatData.paymentMethod || 'Pago externo'}

            return {

                whatsappUrl: whatsappUrl,

        function enviarReportes() {
            const statusDiv = document.getElementById('status');

            const btnEnviar = document.getElementById('btnEnviar');
            
            btnEnviar.disabled = true;
            btnEnviar.textContent = '⏳ Enviando...';
            
            statusDiv.className = 'status info';
            statusDiv.innerHTML = '<strong>⏳ Preparando reportes...</strong>';
            resultsDiv.innerHTML = '';

            const report17 = sendPresentialSeatReport(seat17Data);

            const report18 = sendPresentialSeatReport(seat18Data);

            // Abrir WhatsApp para Asiento 17

                statusDiv.className = 'status success';
                statusDiv.innerHTML = '<strong>✅ Abriendo WhatsApp para Simeona Britez...</strong>';
