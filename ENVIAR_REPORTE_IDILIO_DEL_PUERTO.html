        // Mostrar preview del reporte
        document.getElementById('reportPreview').textContent = reporte;

        // Preparar email
        const emailSubject = encodeURIComponent(`Reporte de Reserva - Idilio del Puerto - Asiento 61 - Congreso CheqFirma`);
        const emailBody = encodeURIComponent(reporte);
        const emailUrl = `mailto:cheqfirma@gmail.com?subject=${emailSubject}&body=${emailBody}`;

        // Botón de email - Abrir directamente el cliente de correo
        document.getElementById('btnEmail').href = emailUrl;
        document.getElementById('btnEmail').onclick = function(e) {
            e.preventDefault();
            // Abrir el cliente de correo directamente
            window.location.href = emailUrl;
            // Mostrar mensaje de confirmación
            setTimeout(function() {
                alert('✅ Se abrió tu cliente de correo con el reporte listo.\n\nDestinatario: cheqfirma@gmail.com\n\nSolo haz clic en "Enviar" para completar el envío.');
            }, 500);
        };

        // Botón de copiar
        document.getElementById('btnCopy').onclick = function(e) {
            e.preventDefault();
            navigator.clipboard.writeText(reporte).then(function() {
                alert('✅ Reporte copiado al portapapeles');
            }, function() {
                // Fallback para navegadores antiguos
                const textArea = document.createElement('textarea');
                textArea.value = reporte;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('✅ Reporte copiado al portapapeles');
            });
        };
    </script>
</body>
